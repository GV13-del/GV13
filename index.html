<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aprendendo com Amor</title>

<style>

:root{
--primary:#ff6b6b;
--secondary:#4ecdc4;
--success:#27ae60;
--danger:#e74c3c;
--dark:#2d3436;
--light:#f5f5f5;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:var(--light);
padding-bottom:90px;
}

.app-header{
background:white;
padding:15px;
text-align:center;
position:sticky;
top:0;
border-bottom:1px solid #ddd;
}

.section{
display:none;
padding:15px;
max-width:700px;
margin:auto;
}

.section.active{
display:block;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
color:white;
background:var(--dark);
margin-top:10px;
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-top:8px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
border-top:1px solid #ddd;
}

.nav-item{
border:none;
background:none;
font-size:11px;
color:gray;
}

.nav-item.active{
color:var(--primary);
font-weight:bold;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
justify-content:center;
align-items:flex-end;
}

.modal-content{
background:white;
width:100%;
max-width:600px;
padding:20px;
border-radius:20px 20px 0 0;
max-height:90vh;
overflow:auto;
}

#login-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

.login-box{
width:90%;
max-width:350px;
padding:30px;
background:white;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
text-align:center;
border-top:5px solid var(--primary);
}

</style>
</head>

<body>

<div id="login-screen">

<div class="login-box">

<h2 style="color:#ff6b6b">
APRENDENDO COM AMOR
</h2>

<input type="password" id="senha" placeholder="Senha">

<button class="btn"
style="background:#ff6b6b"
onclick="login()">

ENTRAR

</button>

</div>

</div>

<div id="main-content" style="display:none">

<div class="app-header">

<h2>APRENDENDO COM AMOR</h2>

</div>

<section id="inicio" class="section active">

<div class="card">

<h3 id="hoje"></h3>

</div>

<div class="card">

Recebido no mês

<h2 id="recebido"
style="color:green">

R$ 0,00

</h2>

</div>

<div class="card">

Pendente no mês

<h2 id="pendente"
style="color:red">

R$ 0,00

</h2>

</div>

<div class="card">

Total de alunos

<h2 id="total-alunos">

0

</h2>

</div>

</section>

<section id="alunos" class="section">

<input
id="pesquisa"
placeholder="Pesquisar aluno">

<div id="lista-alunos"></div>

<button
class="btn"
style="
position:fixed;
right:20px;
bottom:100px;
width:60px;
height:60px;
border-radius:50%;
background:#ff6b6b;
font-size:25px"
onclick="abrirCadastro()">

+

</button>

</section>

<section id="agenda" class="section">

<div id="lista-agenda"></div>

</section>

<section id="sistema" class="section">

<div class="card">

<button class="btn">

FICHA DE MATRÍCULA

</button>

<button
class="btn"
style="background:green">

BACKUP

</button>

</div>

</section>

<nav class="bottom-nav">

<button class="nav-item active"
onclick="trocarAba('inicio',this)">
🏠<br>INÍCIO
</button>

<button class="nav-item"
onclick="trocarAba('alunos',this)">
👥<br>ALUNOS
</button>

<button class="nav-item"
onclick="trocarAba('agenda',this)">
📅<br>AGENDA
</button>

<button class="nav-item"
onclick="trocarAba('sistema',this)">
⚙️<br>SISTEMA
</button>

</nav>

<div class="modal" id="modalCadastro">

<div class="modal-content">

<h3>Novo Aluno</h3>

<input id="nome" placeholder="Nome">

<input id="responsavel" placeholder="Responsável">

<input id="zap" placeholder="WhatsApp">

<input id="valor" placeholder="Mensalidade">

<input id="vencimento" placeholder="Dia vencimento">

<textarea id="obs"
placeholder="Observações"></textarea>
<h3 style="margin-top:15px">
Horários
</h3>

<select id="seg">
<option value="">Segunda - Sem aula</option>
<option>13:00 às 14:00</option>
<option>14:00 às 15:00</option>
<option>15:00 às 16:00</option>
<option>16:00 às 17:00</option>
</select>

<select id="ter">
<option value="">Terça - Sem aula</option>
<option>13:00 às 14:00</option>
<option>14:00 às 15:00</option>
<option>15:00 às 16:00</option>
<option>16:00 às 17:00</option>
</select>

<select id="qua">
<option value="">Quarta - Sem aula</option>
<option>13:00 às 14:00</option>
<option>14:00 às 15:00</option>
<option>15:00 às 16:00</option>
<option>16:00 às 17:00</option>
</select>

<select id="qui">
<option value="">Quinta - Sem aula</option>
<option>13:00 às 14:00</option>
<option>14:00 às 15:00</option>
<option>15:00 às 16:00</option>
<option>16:00 às 17:00</option>
</select>

<select id="sex">
<option value="">Sexta - Sem aula</option>
<option>13:00 às 14:00</option>
<option>14:00 às 15:00</option>
<option>15:00 às 16:00</option>
<option>16:00 às 17:00</option>
</select>

<select id="sab">
<option value="">Sábado - Sem aula</option>
<option>08:00 às 09:00</option>
<option>09:00 às 10:00</option>
<option>10:00 às 11:00</option>
<option>11:00 às 12:00</option>
<option>13:00 às 14:00</option>
<option>14:00 às 15:00</option>
<option>15:00 às 16:00</option>
<option>16:00 às 17:00</option>
</select>

<button class="btn"
style="background:#ff6b6b"
onclick="salvarAluno()">

SALVAR

</button>

<button class="btn"
onclick="fecharCadastro()">

FECHAR

</button>

</div>
</div>

<script>

let alunos =
JSON.parse(localStorage.getItem("alunos_reforco")) || [];

const meses=[
"Jan","Fev","Mar","Abr","Mai","Jun",
"Jul","Ago","Set","Out","Nov","Dez"
];

function login(){

if(document.getElementById("senha").value=="reforco"){

document.getElementById("login-screen").style.display="none";

document.getElementById("main-content").style.display="block";

renderAlunos();

atualizarFinanceiro();

renderAgenda();

}else{

alert("Senha incorreta");

}

}

function abrirCadastro(){

document.getElementById("modalCadastro").style.display="flex";

}

function fecharCadastro(){

document.getElementById("modalCadastro").style.display="none";

}

function trocarAba(id,botao){

document.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document.querySelectorAll(".nav-item")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

botao.classList.add("active");

}
function salvarAluno(){

let aluno={

id:Date.now(),

nome:document.getElementById("nome").value,

responsavel:document.getElementById("responsavel").value,

zap:document.getElementById("zap").value,

valor:document.getElementById("valor").value,

vencimento:document.getElementById("vencimento").value,

obs:document.getElementById("obs").value,

pagos:[],

agenda:{

Segunda:document.getElementById("seg").value,

Terça:document.getElementById("ter").value,

Quarta:document.getElementById("qua").value,

Quinta:document.getElementById("qui").value,

Sexta:document.getElementById("sex").value,

Sábado:document.getElementById("sab").value

}

};

if(aluno.nome==""){

alert("Digite o nome");

return;

}

alunos.push(aluno);

localStorage.setItem(
"alunos_reforco",
JSON.stringify(alunos)
);

fecharCadastro();

renderAlunos();

renderAgenda();

atualizarFinanceiro();

}

function renderAlunos(){

let lista=
document.getElementById(
"lista-alunos"
);

lista.innerHTML="";

alunos.forEach(al=>{

lista.innerHTML+=`

<div class="card">

<h3>${al.nome}</h3>

Responsável:
${al.responsavel}

<br><br>

<button class="btn"

style="background:#25D366"

onclick="window.open('https://wa.me/55${al.zap}')">

WHATSAPP

</button>

<button class="btn"

style="background:red"

onclick="excluirAluno(${al.id})">

EXCLUIR

</button>

</div>

`;

});

}

function excluirAluno(id){

if(confirm("Excluir aluno?")){

alunos=
alunos.filter(
a=>a.id!=id
);

localStorage.setItem(
"alunos_reforco",
JSON.stringify(alunos)
);

renderAlunos();

renderAgenda();

atualizarFinanceiro();

}

}

document
.getElementById("pesquisa")
.onkeyup=function(){

let texto=
this.value.toLowerCase();

document
.getElementById(
"lista-alunos"
)
.innerHTML="";

alunos

.filter(a=>

a.nome
.toLowerCase()
.includes(texto)

||

a.responsavel
.toLowerCase()
.includes(texto)

)

.forEach(al=>{

document
.getElementById(
"lista-alunos"
)

.innerHTML+=`

<div class="card">

<h3>${al.nome}</h3>

Responsável:
${al.responsavel}

</div>

`;

});

};
function renderAgenda(){

let lista=document.getElementById("lista-agenda");

lista.innerHTML="";

["Segunda","Terça","Quarta","Quinta","Sexta","Sábado"]

.forEach(dia=>{

lista.innerHTML+=`

<div class="card">

<h3>${dia}</h3>

<div id="dia-${dia}">

Nenhum aluno

</div>

</div>

`;

});

atualizarAgenda();

}

function atualizarAgenda(){

["Segunda","Terça","Quarta","Quinta","Sexta","Sábado"]

.forEach(dia=>{

let div=document.getElementById("dia-"+dia);

if(!div)return;

let listaDia=alunos.filter(

a=>a.agenda && a.agenda[dia]

);

if(listaDia.length==0){

div.innerHTML="Nenhum aluno";

}

else{

div.innerHTML="";

listaDia

.sort((a,b)=>

(a.agenda[dia]||"")

.localeCompare(

b.agenda[dia]||""

)

)

.forEach(al=>{

div.innerHTML+=`

<div style="padding:10px;border-bottom:1px solid #ddd">

<b>${al.agenda[dia]}</b>

<br>

${al.nome}

</div>

`;

});

}

});

}

function atualizarFinanceiro(){

let mesAtual=

meses[new Date().getMonth()];

let recebido=0;

let pendente=0;

alunos.forEach(al=>{

let valor=parseFloat(al.valor)||0;

if(al.pagos.includes(mesAtual))

recebido+=valor;

else

pendente+=valor;

});

document.getElementById("recebido")

.innerHTML=

"R$ "+recebido.toFixed(2);

document.getElementById("pendente")

.innerHTML=

"R$ "+pendente.toFixed(2);

document.getElementById("total-alunos")

.innerHTML=

alunos.length;

document.getElementById("hoje")

.innerHTML=

new Date().toLocaleDateString(

"pt-BR",

{

weekday:"long",

day:"numeric",

month:"long"

}

);

}
function togglePagamento(id,mes){

let al=alunos.find(a=>a.id==id);

if(!al.pagos)
al.pagos=[];

if(al.pagos.includes(mes)){

al.pagos=al.pagos.filter(
m=>m!=mes
);

}else{

al.pagos.push(mes);

}

localStorage.setItem(
"alunos_reforco",
JSON.stringify(alunos)
);

renderAlunos();

atualizarFinanceiro();

}

function renderAlunos(){

let lista=document.getElementById(
"lista-alunos"
);

lista.innerHTML="";

alunos.forEach(al=>{

lista.innerHTML+=`

<div class="card">

<h3>${al.nome}</h3>

Responsável:
${al.responsavel}

<br><br>

<div style="
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:5px">

${meses.map(m=>

`<button

style="
padding:8px;
border:none;
border-radius:5px;
background:

${al.pagos.includes(m)
?"#27ae60"
:"#ddd"}

"

onclick="togglePagamento(
${al.id},
'${m}'
)">

${m}

</button>`

).join("")}

</div>

<br>

<button class="btn"

style="background:#25D366"

onclick="window.open(
'https://wa.me/55${al.zap}'
)">

WHATSAPP

</button>

<button class="btn"

onclick="gerarMatricula(
${al.id}
)">

MATRÍCULA

</button>

<button class="btn"

style="background:#4ecdc4"

onclick="gerarRecibo(
${al.id}
)">

RECIBO

</button>

<button class="btn"

style="background:red"

onclick="excluirAluno(
${al.id}
)">

EXCLUIR

</button>

</div>

`;

});

}
function gerarMatricula(id){

let al=alunos.find(a=>a.id==id);

let janela=window.open("","_blank");

janela.document.write(`

<h1 style="text-align:center">
APRENDENDO COM AMOR
</h1>

<h2 style="text-align:center">
FICHA DE MATRÍCULA
</h2>

<hr>

<p><b>Aluno:</b> ${al.nome}</p>

<p><b>Responsável:</b> ${al.responsavel}</p>

<p><b>WhatsApp:</b> ${al.zap}</p>

<p><b>Mensalidade:</b> R$ ${al.valor}</p>

<p><b>Vencimento:</b> Dia ${al.vencimento}</p>

<h3>Horários</h3>

<p>Segunda: ${al.agenda.Segunda||"-"}</p>

<p>Terça: ${al.agenda.Terça||"-"}</p>

<p>Quarta: ${al.agenda.Quarta||"-"}</p>

<p>Quinta: ${al.agenda.Quinta||"-"}</p>

<p>Sexta: ${al.agenda.Sexta||"-"}</p>

<p>Sábado: ${al.agenda.Sábado||"-"}</p>

<h3>Observações</h3>

<p>${al.obs}</p>

<br><br><br>

<center>

________________________________

<br>

Assinatura do Responsável

</center>

`);

janela.print();

}

function gerarRecibo(id){

let al=alunos.find(a=>a.id==id);

let janela=window.open("","_blank");

janela.document.write(`

<h1 style="text-align:center">
APRENDENDO COM AMOR
</h1>

<h2 style="text-align:center">
RECIBO DE PAGAMENTO
</h2>

<hr>

<p><b>Aluno:</b> ${al.nome}</p>

<p><b>Responsável:</b> ${al.responsavel}</p>

<p><b>Valor:</b> R$ ${al.valor}</p>

<p><b>Data:</b> ${new Date().toLocaleDateString("pt-BR")}</p>

<br><br><br>

<center>

________________________________

<br>

Assinatura

</center>

`);

janela.print();

}

</script>

</body>
</html>
