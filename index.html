<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Search</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            background-color: #fff;
        }

        /* TOPO DA TELA */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 20px;
            font-size: 13px;
        }

        header a, header span {
            color: #000;
            text-decoration: none;
            margin-left: 15px;
        }

        header a:hover {
            text-decoration: underline;
        }

        .login-btn {
            background-color: #1a73e8;
            color: white !important;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-link {
            color: #d93025;
            cursor: pointer;
            font-weight: bold;
        }

        /* SEÇÕES DA PÁGINA */
        .page-section {
            display: none;
        }

        /* TELA 1: HOME DE BUSCA */
        #section-home {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
            transform: translateY(-30px);
        }

        .logo {
            font-size: 85px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 25px;
            user-select: none;
            cursor: pointer;
        }

        .n-blue { color: #4285F4; }
        .n-red { color: #EA4335; }
        .n-yellow { color: #FBBC05; }
        .n-green { color: #34A853; }

        .search-container {
            width: 100%;
            max-width: 584px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 10px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
        }

        .search-box:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: transparent;
        }

        .button-container {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
        }

        .btn:hover {
            border: 1px solid #dadce0;
            color: #202124;
        }

        /* TELA 2: RESULTADOS REALISTAS */
        #section-results {
            flex-direction: column;
            flex-grow: 1;
        }

        .results-header {
            display: flex;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #ebebeb;
            gap: 30px;
        }

        .results-logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            cursor: pointer;
        }

        .results-search-box {
            width: 100%;
            max-width: 692px;
            padding: 10px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
        }

        .results-content {
            padding: 30px 40px 30px 180px;
            max-width: 800px;
        }

        .results-stats {
            font-size: 14px;
            color: #70757a;
            margin-bottom: 25px;
        }

        .search-result {
            margin-bottom: 30px;
            text-align: left;
        }

        .result-source {
            font-size: 13px;
            color: #202124;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .result-title {
            font-size: 20px;
            color: #1a0dab;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 4px;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-snippet {
            font-size: 14px;
            color: #4d5156;
            line-height: 1.58;
        }

        .loading-text {
            font-size: 16px;
            color: #70757a;
            font-style: italic;
        }

        /* MODAIS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .modal-box h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .modal-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            outline: none;
        }

        .modal-box .primary-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 18px;
            color: #70757a;
            margin-top: -10px;
        }

        /* RODAPÉ */
        footer {
            background-color: #f2f2f2;
            font-size: 14px;
            color: #70757a;
            border-top: 1px solid #e4e4e4;
        }

        .footer-credits {
            padding: 12px 30px;
            border-bottom: 1px solid #e4e4e4;
            font-weight: bold;
            color: #4f5357;
            font-size: 13px;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
        }

        .footer-links a {
            color: #70757a;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header id="main-header">
        <a href="#">Gmail</a>
        <a href="#">Imagens</a>
        <div id="auth-area">
            <span onclick="openModal('login')" class="login-btn">Fazer login</span>
        </div>
    </header>

    <!-- TELA 1: HOME PRINCIPAL -->
    <div id="section-home" class="page-section" style="display: flex;">
        <div class="logo" onclick="goToHome()">
            <span class="n-blue">N</span><span class="n-red">e</span><span class="n-yellow">x</span><span class="n-blue">u</span><span class="n-green">s</span>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" class="search-box" autocomplete="off" autofocus onkeydown="checkEnter(event, 'home')">
            
            <div class="button-container">
                <button type="button" class="btn" onclick="fetchResultsFromGoogle('home')">Pesquisa Nexus</button>
                <button type="button" class="btn" onclick="fetchResultsFromGoogle('home')">Estou com sorte</button>
            </div>
        </div>
    </div>

    <!-- TELA 2: RESULTADOS REAIS DA API -->
    <div id="section-results" class="page-section">
        <div class="results-header">
            <div class="results-logo" onclick="goToHome()">
                <span class="n-blue">N</span><span class="n-red">e</span><span class="n-yellow">x</span><span class="n-blue">u</span><span class="n-green">s</span>
            </div>
            <input type="text" id="results-input" class="results-search-box" onkeydown="checkEnter(event, 'results')">
        </div>
        
        <div class="results-content">
            <div id="results-stats" class="results-stats"></div>
            <!-- Os blocos de sites reais vão entrar aqui dentro dinamicamente -->
            <div id="api-results-container"></div>
        </div>
    </div>

    <!-- MODAIS DE ACESSO -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal('login')">&times;</span>
            <h2>Fazer Login</h2>
            <input type="email" id="login-email" placeholder="E-mail">
            <input type="password" id="login-pass" placeholder="Senha">
            <button class="primary-btn" onclick="handleLogin()">Entrar</button>
        </div>
    </div>

    <footer>
        <div class="footer-credits">Desenvolvido por GV13 Studios</div>
        <div class="footer-links">
            <div>
                <a href="#" style="margin-right: 25px;">Sobre o Nexus</a>
                <a href="#" style="margin-right: 25px;">Privacidade</a>
                <a href="#">Termos</a>
            </div>
            <div><a href="#">Brasil</a></div>
        </div>
    </footer>

    <script>
        // CONFIGURAÇÕES DA API DO GOOGLE (INSIRA SUAS CHAVES AQUI)
        const API_KEY = "SUA_API_KEY_AQUI";
        const SEARCH_ENGINE_ID = "SEU_SEARCH_ENGINE_ID_AQUI";

        document.addEventListener("DOMContentLoaded", checkLoginStatus);

        // DISPARADOR PELO ENTER
        function checkEnter(event, source) {
